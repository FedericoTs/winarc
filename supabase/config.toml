# Supabase local config. Values here are for local development only.
project_id = "winarc"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "winarc://auth"
additional_redirect_urls = ["https://127.0.0.1:3000", "winarc://auth"]
jwt_expiry = 3600
enable_signup = true

[auth.external.apple]
enabled = false
client_id = ""
secret = ""

[functions.verify-proof]
verify_jwt = true

[functions.close-day]
verify_jwt = false

[functions.settle-week]
verify_jwt = false
